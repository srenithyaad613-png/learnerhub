<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Gyami</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <div class="welcome-section">

        <h1>Gyami</h1>

        <h2>Start Your Learning Journey</h2>

        <p>
            One place for every learner to explore,
            learn, practice and grow.
        </p>

    </div>


    <div class="login-box">

        <h2>Create Account 🎓</h2>

        <p class="subtitle">
            Join Gyami and start learning
        </p>


        <label>Name</label>

        <input
            type="text"
            id="signupName"
            placeholder="Enter your name"
        >


        <label>Email</label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
        >


        <label>Password</label>

        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
        >


        <button onclick="createAccount()">
            Create Account
        </button>


        <p id="signupMessage" class="search-message"></p>


        <p class="signup-text">

            Already have an account?

            <span
                onclick="window.location.href='index.html'"
                style="cursor:pointer;"
            >
                Login
            </span>

        </p>

    </div>

</div>


<script>

async function createAccount() {

    const name =
        document.getElementById("signupName").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value.trim();

    const message =
        document.getElementById("signupMessage");


    if (!name || !email || !password) {

        message.textContent =
            "Please fill in all fields. 😊";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Password should contain at least 6 characters.";

        return;
    }


    message.textContent =
        "Creating your Gyami account... ⏳";


    try {

        const response = await fetch("/api/signup", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                name: name,
                email: email,
                password: password

            })

        });


        const data = await response.json();


        if (!response.ok) {

            message.textContent =
                data.detail || "Could not create account.";

            return;
        }


        message.textContent =
            "🎉 Account created successfully!";


        setTimeout(function() {

            window.location.href = "index.html";

        }, 1000);


    } catch (error) {

        console.error(error);

        message.textContent =
            "⚠️ Could not connect to Gyami.";

    }

}

</script>

</body>

</html>
